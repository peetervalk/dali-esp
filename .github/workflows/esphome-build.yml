name: ESPHome Build

# Almost nothing outside test/ was built by CI before this workflow. The host
# suites compile components/dali with a host compiler, and two of them reach
# into esphome/components/dali/light/ for dali_light_state_mailbox.h and
# dali_light_profile.h — but that is the whole of the ESPHome side. Nothing
# validated the Python schema, the ESPHome C++ translation units, the YAML in
# this repo, or the vendoring that carries the C stack into an ESPHome build
# tree.
#
# Jobs, cheapest first:
#
#   sources   source/shim/CMakeLists manifests agree (seconds)
#   discover  find the tracked configs and sort them by component source
#   config    Python schema + every discovered YAML, one check each (~1 min)
#   compile   full C++ and vendored C, per buildable YAML, in parallel (~5-20 min)
#
# Which YAMLs: whatever `git ls-files dali*.yaml` finds. Nothing is named here,
# so a config added to the repo is covered without editing this file, and a
# config removed from it stops being referenced by a job that would then fail
# looking for it.
#
# Why discover sorts them. A config that says `type: local` builds the tree
# under test, so compiling it means something — dali_test.yaml exists for
# exactly that and is deliberately the widest config here. A config that pins
# `type: git` at a ref describes what a *user* builds; ESPHome would fetch that
# ref and compile it instead of the branch, so a 20-minute build would report
# on code the pull request never touched. Those are validated only, which is
# still worth doing: it catches a tracked config drifting out of schema with
# the ref it names, and either the pin or the config then needs updating before
# release.
#
# The clean-room packaging build — the one that proves a consumer can build
# from a release tag with none of this repo around it — is release-packaging.yml.

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  sources:
    name: Source manifests agree
    runs-on: ubuntu-latest

    # Three hand-maintained lists have to stay in lockstep with the C sources:
    # components/dali/CMakeLists.txt SRCS (native build), the proto_dali_*.c
    # shims (ESPHome build), and the sources themselves. Both build routes fail
    # silently rather than loudly when one drifts — ESPHome vendors each .c as
    # .c.inc specifically so its src/*.* glob cannot compile it, leaving the
    # shim as the only entry point, and an unlisted source is simply absent
    # from the link. This catches either omission in seconds instead of after a
    # full toolchain download and a confusing undefined-reference dump.
    steps:
      - uses: actions/checkout@v7

      - name: Check every C source has a shim and a CMakeLists entry
        run: |
          fail=0
          for src in components/dali/dali_*.c; do
            base=$(basename "$src")
            if [ ! -f "esphome/components/dali/proto_${base}" ]; then
              echo "::error file=${src}::no ESPHome shim; add esphome/components/dali/proto_${base}"
              fail=1
            fi
            if ! grep -q "\"${base}\"" components/dali/CMakeLists.txt; then
              echo "::error file=components/dali/CMakeLists.txt::${base} is missing from SRCS"
              fail=1
            fi
          done
          for shim in esphome/components/dali/proto_dali_*.c; do
            base=$(basename "$shim")
            base=${base#proto_}
            if [ ! -f "components/dali/${base}" ]; then
              echo "::error file=${shim}::shim has no source components/dali/${base}"
              fail=1
            fi
          done
          exit $fail

  discover:
    name: Discover in-repo configs
    runs-on: ubuntu-latest

    outputs:
      all: ${{ steps.find.outputs.all }}
      buildable: ${{ steps.find.outputs.buildable }}
      any_buildable: ${{ steps.find.outputs.any_buildable }}

    steps:
      - uses: actions/checkout@v7

      - name: Find tracked dali*.yaml and sort by component source
        id: find
        run: |
          # git ls-files rather than a shell glob: only tracked files count, so
          # a scratch config left in a working tree cannot break a CI run, and
          # an unmatched glob cannot degrade into the literal pattern.
          mapfile -t configs < <(git ls-files 'dali*.yaml' 'dali*.yml')

          if [ ${#configs[@]} -eq 0 ]; then
            echo "::error::no tracked dali*.yaml found; nothing for this workflow to check"
            exit 1
          fi

          buildable=()
          for cfg in "${configs[@]}"; do
            # `type: local` under external_components is what makes a config
            # build this checkout. Anything else (a git ref) would fetch and
            # compile someone else's tree — see the note at the top.
            if grep -Eq '^[[:space:]]*type:[[:space:]]*local[[:space:]]*$' "$cfg"; then
              buildable+=("$cfg")
              echo "  $cfg -> validate + compile (local component source)"
            else
              echo "  $cfg -> validate only (external component source)"
            fi
          done

          to_json() {
            if [ "$#" -eq 0 ]; then printf '[]'; else printf '%s\n' "$@" | jq -R -s -c 'split("\n") | map(select(length > 0))'; fi
          }

          {
            echo "all=$(to_json "${configs[@]}")"
            echo "buildable=$(to_json "${buildable[@]}")"
            echo "any_buildable=$([ ${#buildable[@]} -gt 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

          if [ ${#buildable[@]} -eq 0 ]; then
            echo "::warning::no config builds from this checkout, so nothing will be compiled." \
                 "A config with external_components source 'type: local' is what gives the" \
                 "ESPHome C++ layer and the vendored C stack any CI coverage at all."
          fi

  config:
    name: esphome config (${{ matrix.config }})
    runs-on: ubuntu-latest
    needs: [discover]

    # Exercises the Python schema in esphome/components/dali/__init__.py and
    # each platform's __init__.py, including the GPIO capability validators,
    # against the configs this repo actually ships. This is the job that would
    # have caught poll_on_event breaking validation on 2026-08-12.
    #
    # One check per config rather than one command over all of them: when a
    # config that pins a release ref fails, that is a different finding from a
    # broken schema, and it should be legible as such in the checks list
    # instead of buried in a shared log.
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.discover.outputs.all) }}

    steps:
      - uses: actions/checkout@v7

      # No `cache: pip` here: it needs a requirements.txt or pyproject.toml to
      # key on, and this repo has neither, so it fails the job outright rather
      # than degrading to a miss.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Write dummy secrets
        run: |
          cat > secrets.yaml <<'EOF'
          # CI COMPILE-ONLY SECRETS — generated per run, never deployed.
          wifi_ssid: "DUMMY_COMPILE_ONLY_NETWORK"
          wifi_ssid2: "DUMMY_COMPILE_ONLY_NETWORK"
          wifi_password: "DUMMY-COMPILE-ONLY"
          ap_password: "DUMMY-COMPILE-ONLY"
          api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          ota_password: "DUMMY-COMPILE-ONLY"
          EOF

      - name: Validate
        run: esphome config ${{ matrix.config }}

  compile:
    name: esphome compile (${{ matrix.config }})
    runs-on: ubuntu-latest
    needs: [sources, discover, config]
    if: needs.discover.outputs.any_buildable == 'true'

    # The only thing in this repo that compiles the ESPHome C++ layer and the
    # vendored C stack together, which is why dali_test.yaml is written to be
    # the widest config here — every platform, every optional block. An option
    # no tracked config names is an option nothing compiles.
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.discover.outputs.buildable) }}

    steps:
      - uses: actions/checkout@v7

      # No `cache: pip` here: it needs a requirements.txt or pyproject.toml to
      # key on, and this repo has neither, so it fails the job outright rather
      # than degrading to a miss.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v6
        with:
          # The xtensa toolchain and ESP-IDF framework downloads dominate a
          # cold run. The build tree itself is deliberately not cached: a stale
          # .pioenvs is a worse failure than a slow build.
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ matrix.config }}-${{ hashFiles(matrix.config) }}
          restore-keys: |
            platformio-${{ runner.os }}-${{ matrix.config }}-
            platformio-${{ runner.os }}-

      - name: Install ESPHome
        run: pip install esphome

      - name: Write dummy secrets
        run: |
          cat > secrets.yaml <<'EOF'
          # CI COMPILE-ONLY SECRETS — generated per run, never deployed.
          wifi_ssid: "DUMMY_COMPILE_ONLY_NETWORK"
          wifi_ssid2: "DUMMY_COMPILE_ONLY_NETWORK"
          wifi_password: "DUMMY-COMPILE-ONLY"
          ap_password: "DUMMY-COMPILE-ONLY"
          api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          ota_password: "DUMMY-COMPILE-ONLY"
          EOF

      - name: Compile
        run: esphome compile ${{ matrix.config }}
