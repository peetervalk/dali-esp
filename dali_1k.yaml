# ESPHome config for DALI Bus 1 — 16 control gear, groups 0/2/3/4/5/6/7
# Hardware: ESP32-WROVER-E + MikroE DALI-2 Click (TX=GPIO18, RX=GPIO19)
# Scan results: addresses 0-15 occupied, group assignments from "export inventory"

esphome:
  name: dali-1k
  friendly_name: "DALI 1k"

esp32:
  board: esp32dev  # covers WROVER-E; add sdkconfig SPIRAM options if PSRAM needed
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: esphome/components

wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password
  ap:
    ssid: "dali-1k-ap"
    password: !secret ap_password
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG  # drop to INFO after first successful connection

# ── DALI bus ──────────────────────────────────────────────────────────────────
dali:
  id: dali_bus
  tx_pin: 18
  rx_pin: 19
  headless_dispatch: true

# ── Lights (one entity per DALI group) ───────────────────────────────────────
# Group numbers match the bus configuration discovered via "export inventory".
# Replace placeholder names with real room/zone names.
#
# Groups 1 and 8-15 have no gear assigned — omitted.

light:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 0"      # addresses 5, 6, 7, 14
    target_type: group
    target_address: 0

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 2"      # addresses 4, 8, 9, 12
    target_type: group
    target_address: 2

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 3"      # address 13
    target_type: group
    target_address: 3

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 4"      # address 1
    target_type: group
    target_address: 4

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 5"      # address 0 (DT6 LED driver)
    target_type: group
    target_address: 5

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 6"      # addresses 2, 3, 10, 11
    target_type: group
    target_address: 6

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 7"      # address 15
    target_type: group
    target_address: 7
