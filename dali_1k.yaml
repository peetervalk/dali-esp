# ESPHome config for DALI Bus 1 — 16 control gear, groups 0/2/3/4/5/6/7
# Hardware: ESP32-WROVER-E + MikroE DALI-2 Click (TX=GPIO18, RX=GPIO19)
# Scan results: addresses 0-15 occupied, group assignments from "export inventory"

esphome:
  name: dali-1k
  friendly_name: "DALI 1k"

esp32:
  board: esp32dev  # covers WROVER-E; add sdkconfig SPIRAM options if PSRAM needed
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/peetervalk/dali-esp.git
      username: !secret github_username
      password: !secret github_token
    components: [dali]
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password
  ap:
    ssid: "dali-1k-ap"
    password: !secret ap_password
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

# ── DALI bus ──────────────────────────────────────────────────────────────────
dali:
  id: dali_bus
  tx_pin: 18
  rx_pin: 19
  headless_dispatch: true
  command_result:
    name: "DALI Command Result"
  bus_fault:
    name: "Bus Fault"

# ── Lights (one entity per DALI group) ───────────────────────────────────────
# Group numbers match the bus configuration discovered via "export inventory".
# Replace placeholder names with real room/zone names.
#
# Groups 1 and 8-15 have no gear assigned — omitted.

light:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 0"      # addresses 5, 6, 7, 14
    target_type: group
    target_address: 0
    query_address: 5

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 2"      # addresses 4, 8, 9, 12
    target_type: group
    target_address: 2
    query_address: 4

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 3"      # address 13
    target_type: group
    target_address: 3
    query_address: 13

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 4"      # address 1
    target_type: group
    target_address: 4
    query_address: 1

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 5"      # address 0 (DT6 LED driver)
    target_type: group
    target_address: 5
    query_address: 0

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 6"      # addresses 2, 3, 10, 11
    target_type: group
    target_address: 6
    query_address: 2

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 7"      # address 15
    target_type: group
    target_address: 7
    query_address: 15

# ── DALI command console ──────────────────────────────────────────────────────
# Type commands in HA; result appears in "DALI Command Result" text sensor.
# Verbs: off/max/min/level/query/config/iquery/iconfig/memread/memwrite/devquery/dtrcheck
# raw <hex> len=<16|24> [wait]  — send an arbitrary frame, optional wait for reply
# raw2 <hex> len=<16|24> [wait] — send twice inside the DALI send-twice window
# Targets: a<N>=short, g<N>=group, b=broadcast
# Examples:
#   off g0                   (turn off group 0)
#   max g2                   (recall max group 2)
#   query a5 actual-level    (read level of short address 5)
#   query b status           (broadcast status query — may cause reply collision)
#   raw 8305 len=16          (group 1 RECALL MAX)
#   raw 0101 len=16 wait     (short addr 0, QUERY STATUS)
text:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Command"
    mode: text
