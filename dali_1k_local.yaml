# dali_1k_local.yaml — local-component build of dali_1k for development.
# Uses esphome/components from the working tree so no git credentials are needed.
# DO NOT flash to production without testing. Production firmware: dali_1k.yaml.

esphome:
  name: dali-1k
  friendly_name: "DALI 1k"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: esphome/components

wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password
  ap:
    ssid: "dali-1k-ap"
    password: !secret ap_password
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

# ── DALI bus ──────────────────────────────────────────────────────────────────
dali:
  id: dali_bus
  tx_pin: 18
  rx_pin: 19
  headless_dispatch: true

# ── Lights (one entity per DALI group) ───────────────────────────────────────
light:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 0"      # addresses 5, 6, 7, 14
    target_type: group
    target_address: 0
    query_address: 5

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 2"      # addresses 4, 8, 9, 12
    target_type: group
    target_address: 2
    query_address: 4

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 3"      # address 13
    target_type: group
    target_address: 3
    query_address: 13

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 4"      # address 1
    target_type: group
    target_address: 4
    query_address: 1

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 5"      # address 0 (DT6 LED driver)
    target_type: group
    target_address: 5
    query_address: 0

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 6"      # addresses 2, 3, 10, 11
    target_type: group
    target_address: 6
    query_address: 2

  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 7"      # address 15
    target_type: group
    target_address: 7
    query_address: 15
