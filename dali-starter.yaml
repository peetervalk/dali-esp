# DALI starter firmware. Flash this, commission the bus, then write your own
# config from what it finds. This file is mostly a shim: it brings up the bus
# and opens the diagnostic shell, which is the tool that does the work.
#
# Workflow, shell verbs, and the Home Assistant fallback: commissioning_readme.md

esphome:
  name: dali-starter
  friendly_name: "DALI Starter"

esp32:
  variant: esp32   # classic ESP32 (e.g. WROVER-E); board is auto-selected
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/peetervalk/dali-esp.git
      ref: v1.1.1
    components: [dali]
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "dali-starter-ap"
    password: !secret ap_password
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO  # button-scan output is at INFO — set DEBUG for PHY-level tracing

dali:
  id: dali_bus
  tx_pin: 18
  rx_pin: 19

  # The diagnostic shell. Omit this block and it is not compiled in at all.
  shell:
    port: 2323
    # Reclaims the single session from a terminal closed without quitting.
    # 0 disables it, at the cost of a lost session locking out the shell
    # until reboot.
    idle_timeout: 10min
    # The port is unauthenticated, so `commission` and the nine commissioning
    # primitives are refused unless this opts in. True here because
    # commissioning is what this firmware is for — set it false on anything
    # left flashed on a shared network. RANDOMISE cannot be undone.
    allow_commissioning: true

  # Text sensors belong to the button/console path, not the shell. They are the
  # only place a result persists in HA.
  command_result:
    name: "DALI Command Result"
  scan_status:
    name: "Scan Status"
  scan_result:
    name: "Scan Result"
  yaml_result:
    name: "Group Map"
  couplers_result:
    name: "Couplers Result"
  bus_monitor:
    name: "Bus Monitor"
  bus_fault:
    name: "Bus Fault"

# Everything below is the Home Assistant fallback: it predates the shell and
# does less, but it works from a phone, it works while someone else holds the
# shell's single session, and its scan is a second implementation of the same
# walk — so a disagreement between the two is a finding. See
# commissioning_readme.md.

number:
  - platform: dali
    dali_id: dali_bus
    name: "Target Address"
    icon: "mdi:numeric"
    mode: box

button:
  - platform: dali
    dali_id: dali_bus
    name: "Scan DALI Bus"
    icon: "mdi:magnify-scan"
    type: scan

  - platform: dali
    dali_id: dali_bus
    name: "Refresh State"
    icon: "mdi:refresh"
    type: refresh

  - platform: dali
    dali_id: dali_bus
    name: "Identify"
    icon: "mdi:lightbulb-on-outline"
    type: identify

  - platform: dali
    dali_id: dali_bus
    name: "Find Couplers"
    icon: "mdi:transit-connection-variant"
    type: find_couplers

  - platform: dali
    dali_id: dali_bus
    name: "Turn On"
    icon: "mdi:lightbulb"
    type: turn_on

  - platform: dali
    dali_id: dali_bus
    name: "Turn Off"
    icon: "mdi:lightbulb-off"
    type: turn_off

  - platform: dali
    dali_id: dali_bus
    name: "Max"
    icon: "mdi:brightness-7"
    type: max

  - platform: dali
    dali_id: dali_bus
    name: "Min"
    icon: "mdi:brightness-2"
    type: min

# Command console: one typed line, one result in "DALI Command Result". It
# cannot stream, so it has no discover/find/capture/commission — but what it
# does have it spells exactly as the shell does. Verbs: dali_commands.md.
text:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Command"
    mode: text
