# DALI diagnostic firmware — discovery and commissioning aid.
# Flash this to discover the bus, identify fixtures, and monitor couplers.
#
# Workflow:
#   1. esphome run dali_diag.yaml
#   2. Press "Find Couplers", activate all physical switches within 30 s.
#      Detected groups appear in the "Couplers Result" sensor.
#   3. Press "Scan DALI Bus" — takes ~50 s for 16 devices.
#      - "Group Map" sensor shows a compact group→query summary (persists in HA).
#      - YAML lines stream to the log prefixed with "YAML|".
#        Save the log session as  dali-diag-logs.txt  in Downloads, then run:
#
#          (Select-String "YAML| " "$env:USERPROFILE\Downloads\dali-diag-logs.txt") |
#            ForEach-Object { $_.Line -replace '.*YAML\| ', '' } |
#            Out-File -Encoding utf8 "$env:USERPROFILE\Downloads\dali_lights.yaml"
#
#        Then add  dali_id: <your_id>  and real names to dali_lights.yaml.
#        JSON inventory is available at DEBUG log level if needed.
#   4. Set "Target Address" (0–63) to a short address found by the scan.
#   5. Press "Identify" to blink the fixture for 10 s to confirm the address.
#   6. Use On / Off / Max / Min to verify control of that fixture.
#   7. "Bus Monitor" shows each unsolicited frame as it arrives.

esphome:
  name: dali-diag
  friendly_name: "DALI Diagnostic"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: esphome/components

wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password
  ap:
    ssid: "dali-diag-ap"
    password: !secret ap_password
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO  # scan output is at INFO — set DEBUG for PHY-level tracing

# ── DALI bus ──────────────────────────────────────────────────────────────────
dali:
  id: dali_bus
  tx_pin: 18
  rx_pin: 19
  scan_status:
    name: "Scan Status"
  scan_result:
    name: "Scan Result"
  yaml_result:
    name: "Group Map"
  couplers_result:
    name: "Couplers Result"
  bus_monitor:
    name: "Bus Monitor"

# ── Target address selector ───────────────────────────────────────────────────
number:
  - platform: dali
    dali_id: dali_bus
    name: "Target Address"
    icon: "mdi:numeric"
    mode: box

# ── Buttons ───────────────────────────────────────────────────────────────────
button:
  - platform: dali
    dali_id: dali_bus
    name: "Scan DALI Bus"
    icon: "mdi:magnify-scan"
    type: scan

  - platform: dali
    dali_id: dali_bus
    name: "Refresh State"
    icon: "mdi:refresh"
    type: refresh

  - platform: dali
    dali_id: dali_bus
    name: "Identify"
    icon: "mdi:lightbulb-on-outline"
    type: identify

  - platform: dali
    dali_id: dali_bus
    name: "Find Couplers"
    icon: "mdi:transit-connection-variant"
    type: find_couplers

  - platform: dali
    dali_id: dali_bus
    name: "Turn On"
    icon: "mdi:lightbulb"
    type: turn_on

  - platform: dali
    dali_id: dali_bus
    name: "Turn Off"
    icon: "mdi:lightbulb-off"
    type: turn_off

  - platform: dali
    dali_id: dali_bus
    name: "Max"
    icon: "mdi:brightness-7"
    type: max

  - platform: dali
    dali_id: dali_bus
    name: "Min"
    icon: "mdi:brightness-2"
    type: min
