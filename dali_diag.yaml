# DALI diagnostic firmware — discovery and commissioning aid.
#
# This config is mainly a shim: it brings up the bus and opens the diagnostic
# shell on a TCP port. The shell is the tool. The buttons, the number, and the
# `text:` console further down are the fallback, kept deliberately — see the
# section that introduces them.
#
# ── Start here ────────────────────────────────────────────────────────────────
#   1. esphome run dali_diag.yaml
#   2. From any host that can reach the device, run the client in this repo
#      (tools/dali-shell — standard library only, nothing to install; it drops
#      straight into the HA "Advanced SSH & Web Terminal" add-on):
#
#          ./dali-shell                              interactive session
#          ./dali-shell discover                     one command, then exit
#          ./dali-shell export inventory > /config/dali_inventory.json
#
#      It defaults to dali-diag.local:2323, which is the name this config
#      claims. Override with --host/--port or DALI_SHELL_HOST/DALI_SHELL_PORT.
#
#      With no client to hand, `nc dali-diag.local 2323` is a complete if
#      unfriendly substitute: the shell is a plain line protocol, and the
#      client only adds history, tab completion, and one-shot redirection.
#   3. `help` lists every verb. `list <table>` prints a named command table
#      (query, special, config, dt6, dt8, iquery, iconfig).
#
#      This is the same shell, running the same code, as the serial console on
#      a native ESP-IDF build — not a subset written for ESPHome.
#
# ── The commissioning walk, in shell verbs ────────────────────────────────────
#   discover                 full scan: short addresses, device types, groups
#   inventory                reprint the last discover without touching the bus
#   export inventory         the same result as JSON — redirect it to a file
#   identify <addr>          blink one fixture to confirm which address it is
#   find switches 300        listen for input-device events and map switches
#   instances <addr>         what a control device actually offers
#   sensor poll <addr>       read an input instance's current value
#   commission unaddressed   assign short addresses — see allow_commissioning
#   max b / off b / level a3 128     drive gear directly while you work
#   trace on                 live per-frame trace
#   capture start … export   rolling capture, dumped when something goes wrong
#   bus check / stats        RX level, scheduler state, fault counters
#
#   A long verb prints as it goes and holds the bus for as long as it runs —
#   `find switches 300` is five minutes by design. Ctrl-C in the client drops
#   the connection, which the device notices between bus steps and stops.
#
# ── One session at a time ─────────────────────────────────────────────────────
#   The bus is single-tenant, so the shell is too. A second connection is
#   accepted only far enough to be told why it is closing. A terminal window
#   closed without quitting is reclaimed by idle_timeout below.

esphome:
  name: dali-diag
  friendly_name: "DALI Diagnostic"

esp32:
  variant: esp32   # classic ESP32 (e.g. WROVER-E); board is auto-selected
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/peetervalk/dali-esp.git
      ref: dev
    components: [dali]
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "dali-diag-ap"
    password: !secret ap_password
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO  # button-scan output is at INFO — set DEBUG for PHY-level tracing

# ── DALI bus ──────────────────────────────────────────────────────────────────
dali:
  id: dali_bus
  tx_pin: 18
  rx_pin: 19

  # The diagnostic shell. Absent = not compiled in at all.
  shell:
    port: 2323
    # Reclaims the single session from a terminal that was closed without
    # quitting. 0 disables it, at the cost of a lost session locking out the
    # shell until reboot.
    idle_timeout: 10min
    # The port is unauthenticated — the same posture as OTA and the web server,
    # but a lower bar than physical access to a UART. So `commission` and the
    # nine commissioning primitives are refused unless this says otherwise.
    #
    # It is true here because commissioning is what this firmware is for. Set
    # it to false on anything left flashed on a shared network: one typed line
    # can readdress a whole bus, and RANDOMISE cannot be undone.
    allow_commissioning: true

  # ── Text sensors ────────────────────────────────────────────────────────────
  # These belong to the button/console path, not the shell — the shell prints
  # to your terminal. They are the only place a result persists in HA, which is
  # what makes them worth keeping alongside it.
  command_result:
    name: "DALI Command Result"
  scan_status:
    name: "Scan Status"
  scan_result:
    name: "Scan Result"
  yaml_result:
    name: "Group Map"
  couplers_result:
    name: "Couplers Result"
  bus_monitor:
    name: "Bus Monitor"
  bus_fault:
    name: "Bus Fault"

# ══ Fallback / comparison / alt mode ══════════════════════════════════════════
#
# Everything below predates the shell and does a fraction of what it does. It
# stays for three reasons:
#
#   - A phone in Home Assistant is not a terminal. Pressing "Identify" while
#     standing under a fixture beats SSHing from a ladder.
#   - The shell allows one session. The buttons keep working while someone else
#     holds it, and while nobody holds it at all.
#   - The button scan and `discover` are separate implementations of the same
#     walk. When a result looks wrong, running both is a real diagnostic — if
#     they disagree, the disagreement is the finding.
#
# ── Button workflow ───────────────────────────────────────────────────────────
#   1. "Find Couplers", then activate every physical switch within 30 s.
#      Detected groups appear in "Couplers Result".        (shell: find switches)
#   2. "Scan DALI Bus" — ~50 s for 16 devices.                 (shell: discover)
#      "Group Map" holds a compact group→query summary, persisted in HA, and
#      YAML lines stream to the log prefixed with "YAML|". To turn a log
#      session saved as dali-diag-logs.txt in Downloads into a YAML file:
#
#        (Select-String "YAML| " "$env:USERPROFILE\Downloads\dali-diag-logs.txt") |
#          ForEach-Object { $_.Line -replace '.*YAML\| ', '' } |
#          Out-File -Encoding utf8 "$env:USERPROFILE\Downloads\dali_lights.yaml"
#
#      Then add  dali_id: <your_id>  and real names.
#      The shell does this in one step: ./dali-shell export inventory > file
#   3. Set "Target Address" (0–63), press "Identify" to blink the fixture.
#      Verify control with On / Off / Max / Min.        (shell: identify <addr>)
#   4. "Bus Monitor" shows the last unsolicited frame.   (shell: trace on)

# ── Target address selector ───────────────────────────────────────────────────
number:
  - platform: dali
    dali_id: dali_bus
    name: "Target Address"
    icon: "mdi:numeric"
    mode: box

# ── Buttons ───────────────────────────────────────────────────────────────────
button:
  - platform: dali
    dali_id: dali_bus
    name: "Scan DALI Bus"
    icon: "mdi:magnify-scan"
    type: scan

  - platform: dali
    dali_id: dali_bus
    name: "Refresh State"
    icon: "mdi:refresh"
    type: refresh

  - platform: dali
    dali_id: dali_bus
    name: "Identify"
    icon: "mdi:lightbulb-on-outline"
    type: identify

  - platform: dali
    dali_id: dali_bus
    name: "Find Couplers"
    icon: "mdi:transit-connection-variant"
    type: find_couplers

  - platform: dali
    dali_id: dali_bus
    name: "Turn On"
    icon: "mdi:lightbulb"
    type: turn_on

  - platform: dali
    dali_id: dali_bus
    name: "Turn Off"
    icon: "mdi:lightbulb-off"
    type: turn_off

  - platform: dali
    dali_id: dali_bus
    name: "Max"
    icon: "mdi:brightness-7"
    type: max

  - platform: dali
    dali_id: dali_bus
    name: "Min"
    icon: "mdi:brightness-2"
    type: min

# ── DALI command console ──────────────────────────────────────────────────────
# One typed line, one text state in "DALI Command Result". That framing is why
# it is not the shell: it cannot stream, so it has no discover, no find, no
# capture, no commission — the verbs whose value is in watching them work.
#
# What it does have, it spells identically, because both surfaces resolve
# through the same tables: a mistyped line fails here exactly as it would there.
# Verbs: queue/raw/raw2/dtr/level/mask/off/up/down/step-*/on-step/cont-*/
#        dapc-seq/last/scene/max/min/status/query/special/config/config-dtr0/
#        dt6/iquery/iconfig/vendor/memread/devmem/dtrcheck/group
# Targets: s<N>=short, g<N>=group, b=broadcast
# Examples:
#   query s0 actual
#   query b status
#   raw FF05 len=16          (broadcast RECALL MAX)
#   raw 0101 len=16 wait     (short addr 0, QUERY STATUS)
# In the shell, `help` prints the real list rather than this one.
text:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Command"
    mode: text
