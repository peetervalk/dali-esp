# DALI diagnostic firmware — discovery and commissioning aid.
# Flash this to discover the bus, identify fixtures, and monitor couplers.
#
# Workflow:
#   1. esphome run dali_diag.yaml
#   2. Press "Find Couplers", activate all physical switches within 30 s.
#      Detected groups appear in the "Couplers Result" sensor.
#   3. Press "Scan DALI Bus" — takes ~50 s for 16 devices.
#      - "Group Map" sensor shows a compact group→query summary (persists in HA).
#      - YAML lines stream to the log prefixed with "YAML|".
#        Save the log session as  dali-diag-logs.txt  in Downloads, then run:
#
#          (Select-String "YAML| " "$env:USERPROFILE\Downloads\dali-diag-logs.txt") |
#            ForEach-Object { $_.Line -replace '.*YAML\| ', '' } |
#            Out-File -Encoding utf8 "$env:USERPROFILE\Downloads\dali_lights.yaml"
#
#        Then add  dali_id: <your_id>  and real names to dali_lights.yaml.
#        JSON inventory is available at DEBUG log level if needed.
#   4. Set "Target Address" (0–63) to a short address found by the scan.
#   5. Press "Identify" to blink the fixture for 10 s to confirm the address.
#   6. Use On / Off / Max / Min to verify control of that fixture.
#   7. "Bus Monitor" shows each unsolicited frame as it arrives.

esphome:
  name: dali-diag
  friendly_name: "DALI Diagnostic"

esp32:
  variant: esp32   # classic ESP32 (e.g. WROVER-E); board is auto-selected
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/peetervalk/dali-esp.git
      ref: v1.0.1
    components: [dali]
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "dali-diag-ap"
    password: !secret ap_password
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO  # scan output is at INFO — set DEBUG for PHY-level tracing

# ── DALI bus ──────────────────────────────────────────────────────────────────
dali:
  id: dali_bus
  tx_pin: 18
  rx_pin: 19
  command_result:
    name: "DALI Command Result"
  scan_status:
    name: "Scan Status"
  scan_result:
    name: "Scan Result"
  yaml_result:
    name: "Group Map"
  couplers_result:
    name: "Couplers Result"
  bus_monitor:
    name: "Bus Monitor"
  bus_fault:
    name: "Bus Fault"

# ── Target address selector ───────────────────────────────────────────────────
number:
  - platform: dali
    dali_id: dali_bus
    name: "Target Address"
    icon: "mdi:numeric"
    mode: box

# ── Buttons ───────────────────────────────────────────────────────────────────
button:
  - platform: dali
    dali_id: dali_bus
    name: "Scan DALI Bus"
    icon: "mdi:magnify-scan"
    type: scan

  - platform: dali
    dali_id: dali_bus
    name: "Refresh State"
    icon: "mdi:refresh"
    type: refresh

  - platform: dali
    dali_id: dali_bus
    name: "Identify"
    icon: "mdi:lightbulb-on-outline"
    type: identify

  - platform: dali
    dali_id: dali_bus
    name: "Find Couplers"
    icon: "mdi:transit-connection-variant"
    type: find_couplers

  - platform: dali
    dali_id: dali_bus
    name: "Turn On"
    icon: "mdi:lightbulb"
    type: turn_on

  - platform: dali
    dali_id: dali_bus
    name: "Turn Off"
    icon: "mdi:lightbulb-off"
    type: turn_off

  - platform: dali
    dali_id: dali_bus
    name: "Max"
    icon: "mdi:brightness-7"
    type: max

  - platform: dali
    dali_id: dali_bus
    name: "Min"
    icon: "mdi:brightness-2"
    type: min

# ── DALI command console ──────────────────────────────────────────────────────
# Type commands in HA; result appears in "DALI Command Result" text sensor.
# Verb names, argument forms, and command names are shared with the native CLI.
# Verbs: queue/raw/raw2/off/max/min/level/query/config/config-dtr0/
#        iquery/iconfig/devmem/dtrcheck/group
# Trailing tokens are rejected, so a mistyped line fails instead of running short.
# raw <hex> len=<16|24> [wait]  — send an arbitrary frame, optional wait for reply
# raw2 <hex> len=<16|24>        — send twice inside the DALI send-twice window
# Targets: a<N>=short, g<N>=group, b=broadcast
# Examples:
#   query a0 actual
#   query b status
#   raw FF05 len=16          (broadcast RECALL MAX)
#   raw 0101 len=16 wait     (short addr 0, QUERY STATUS)
text:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Command"
    mode: text
