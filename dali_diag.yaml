# DALI diagnostic firmware — discovery and commissioning aid.
# Flash this to discover the bus, identify fixtures, and monitor couplers.
#
# Workflow:
#   1. esphome run dali_diag.yaml
#   2. Press "Scan DALI Bus" in HA — full YAML snippet appears in the device logs.
#      The "Scan Result" sensor shows a compact summary that persists in HA.
#   3. Set "Target Address" (0–63) to a short address found by the scan.
#   4. Press "Identify" to blink the fixture for 10 s to confirm the address.
#   5. Use On / Off / Max / Min to verify control of that fixture.
#   6. Press "Find Couplers" and activate physical switches — coupler frames
#      are captured for 30 s and published to the "Couplers Result" sensor.
#   7. "Bus Monitor" shows each unsolicited frame as it arrives.

esphome:
  name: dali-diag
  friendly_name: "DALI Diagnostic"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: esphome/components

wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password
  ap:
    ssid: "dali-diag-ap"
    password: !secret ap_password
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO  # scan output is at INFO — set DEBUG for PHY-level tracing

# ── DALI bus ──────────────────────────────────────────────────────────────────
dali:
  id: dali_bus
  tx_pin: 18
  rx_pin: 19
  scan_status:
    name: "Scan Status"
  scan_result:
    name: "Scan Result"
  couplers_result:
    name: "Couplers Result"
  bus_monitor:
    name: "Bus Monitor"

# ── Target address selector ───────────────────────────────────────────────────
number:
  - platform: dali
    dali_id: dali_bus
    name: "Target Address"
    icon: "mdi:numeric"

# ── Buttons ───────────────────────────────────────────────────────────────────
button:
  - platform: dali
    dali_id: dali_bus
    name: "Scan DALI Bus"
    icon: "mdi:magnify-scan"
    type: scan

  - platform: dali
    dali_id: dali_bus
    name: "Refresh State"
    icon: "mdi:refresh"
    type: refresh

  - platform: dali
    dali_id: dali_bus
    name: "Identify"
    icon: "mdi:lightbulb-on-outline"
    type: identify

  - platform: dali
    dali_id: dali_bus
    name: "Find Couplers"
    icon: "mdi:transit-connection-variant"
    type: find_couplers

  - platform: dali
    dali_id: dali_bus
    name: "Turn On"
    icon: "mdi:lightbulb"
    type: turn_on

  - platform: dali
    dali_id: dali_bus
    name: "Turn Off"
    icon: "mdi:lightbulb-off"
    type: turn_off

  - platform: dali
    dali_id: dali_bus
    name: "Max"
    icon: "mdi:brightness-7"
    type: max

  - platform: dali
    dali_id: dali_bus
    name: "Min"
    icon: "mdi:brightness-2"
    type: min
