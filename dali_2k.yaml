# ESPHome config for DALI Bus 2 — 5 control gear, group 0
# Hardware: ESP32-WROVER-E + MikroE DALI-2 Click (TX=GPIO18, RX=GPIO19)
# Bus layout (from "discover"):
#   addr 0: lamp + Steinel HF 360 II (input device, 4 instances: light/occupancy/temp/humidity)
#   addr 1: lamp + DALI-2 PB coupler (1 instance: push button, BF6 legacy mode)
#   addr 2, 3, 5: plain lamps
#   addr 4: absent
#   All lamps in group 0; BF6 coupler sends group 0 off/recall-max

esphome:
  name: dali-2k
  friendly_name: "DALI 2k"

esp32:
  board: esp32dev  # covers WROVER-E; add sdkconfig SPIRAM options if PSRAM needed
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/peetervalk/dali-esp.git
      ref: main
      username: !secret github_username
      password: !secret github_token
    components: [dali]
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password
  ap:
    ssid: "dali-2k-ap"
    password: !secret ap_password
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

# ── DALI bus ──────────────────────────────────────────────────────────────────
dali:
  id: dali_bus
  tx_pin: 18
  rx_pin: 19
  headless_dispatch: true
  command_result:
    name: "DALI Command Result"
  bus_fault:
    name: "Bus Fault"

# ── Lights ────────────────────────────────────────────────────────────────────
# One group covers all 5 lamps.
# query_address=2 uses a plain lamp (no shared input device) for level polling.

light:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 0"
    target_type: group
    target_address: 0
    query_address: 2

# ── DALI command console ──────────────────────────────────────────────────────
# Type commands in HA; result appears in "DALI Command Result" text sensor.
# Reliable diagnostics: raw <hex> len=<16|24> [wait], raw2 <hex> len=<16|24> [wait]
# raw2 sends the same frame twice inside the DALI send-twice window; this avoids
# HA text entities swallowing repeated identical commands.
# Existing helper verbs remain available:
#   off/max/min/level/query/config/iquery/iconfig/memread/memwrite/devquery/dtrcheck
# Targets: a<N>=short, g<N>=group, b=broadcast
# Examples:
#   raw C13102 len=24    (DTR1 = 0x02 bank 2)
#   raw C13004 len=24    (DTR0 = 0x04 global sensitivity offset)
#   raw 01FE3C len=24 wait  (read memory location from Steinel)
#   raw2 01FE15 len=24    (ENABLE WRITE MEMORY x2)
#   query a0 actual-level
#   config a0 set-max-dtr0 200
#   iconfig a0:1 set-report-timer 5  (occupancy report timer; C13005 + 010122 x2)
#   memread a0 2 4  (Steinel Bank 2 global sensitivity; C13102 + C13004 + 01FE3C)
#   raw 01FE36 len=24 wait  (opcode 0x36 = QUERY CONTENT DTR0)
#   raw 01FE37 len=24 wait  (opcode 0x37 = QUERY CONTENT DTR1)
#   devquery a0 54   (same as raw 01FE36 len=24 wait)
#   devquery a0 55   (same as raw 01FE37 len=24 wait)
#   dtrcheck a0 0 66  (C13042 + 01FE36, verifies control-device DTR0)
# Steinel Bank 2 map (from DALI-2 Interface Description V1.5):
#   0x02 = lock byte (write 0x55 to unlock before raw writes)
#   0x04 = global sensitivity  (0x00=min, 0xFF=max/default)
#   0x05 = detection range     (0x00=min, 0xFF=max)
#   0x06-0x09 = per-direction range      (0x00-0x64, percent)
#   0x0A-0x0D = per-direction sensitivity (0x00-0x64, percent)
text:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Command"
    mode: text

# ── Steinel HF 360 II — addr 0, 4 instances ──────────────────────────────────
# Unsolicited event frame instance byte (IEC 62386-103):
#   bit7=1 (input device), bits6:2=instance number, bits1:0=event scheme
#   0x80=inst0 (lux), 0x84=inst1 (occupancy), 0x88=inst2, 0x8C=inst3
# Occupancy raw values: 0=free, 85=movement, 170=hold/present, 255=present+moving.
# Occupancy sensor (inst 1, 1-byte) gets immediate push updates from unsolicited
# events; poll_interval is a fallback only — can be raised to e.g. 60 s.
# Steinel factory section 3: hold timer 1 (~10 s), report timer 5 s.
# On-demand occupancy read: iquery a0:1 input-value  → 0=free 85=move 170=present 255=both
# Read before writing:      iquery a0:1 hold-timer
# Tune report timer:        iconfig a0:1 set-report-timer N
# Tune sensitivity/range with the raw Bank 2 sequences in steinel_bank2_reference.md.

sensor:
  - platform: dali
    dali_id: dali_bus
    name: "Zone 2 Lux"
    address: 0
    instance: 0
    poll_interval: 30
    value_bytes: 2
    scale: 0.01
    unit_of_measurement: "lx"
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 0

  - platform: dali
    dali_id: dali_bus
    id: zone2_occ_raw
    name: "Zone 2 Occupancy Raw"
    address: 0
    instance: 1
    poll_interval: 5
    unit_of_measurement: ""
    state_class: measurement
    accuracy_decimals: 0
    internal: true

  - platform: dali
    dali_id: dali_bus
    name: "Zone 2 Temperature"
    address: 0
    instance: 2
    poll_interval: 60
    value_bytes: 2
    scale: 0.1
    offset: -5.0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: dali
    dali_id: dali_bus
    name: "Zone 2 Humidity"
    address: 0
    instance: 3
    poll_interval: 60
    scale: 0.5
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0

# ── Occupancy state (human-readable) ─────────────────────────────────────────
# Maps DT303 bit-replicated values: 0=free, 85=movement, 170=present, 255=present+moving.
text_sensor:
  - platform: template
    name: "Zone 2 Occupancy"
    lambda: |-
      int v = (int) id(zone2_occ_raw).state;
      if (v == 0)   return {"Unoccupied"};
      if (v == 85)  return {"Movement"};
      if (v == 170) return {"Present"};
      if (v == 255) return {"Present + Moving"};
      return {"Unknown"};
    update_interval: 5s
