# ESPHome config for DALI Bus 2 — 5 control gear, group 0
# Hardware: ESP32-WROVER-E + MikroE DALI-2 Click (TX=GPIO18, RX=GPIO19)
#
# Tracked reference copy of the second-floor site configuration. Credentials are
# all !secret lookups resolved from the untracked root secrets.yaml; nothing in
# this file is site-private beyond the address, group, and sensor layout.
#
# The component source is the in-repo one rather than a release tag, so this
# file and the component it configures always agree within a commit. A tracked
# config pinned to an older tag silently drifts out of schema with the tree
# beside it, which is exactly how `poll_on_event` broke validation on 2026-08-12.
# Bus layout (from "discover"):
#   addr 0: lamp + Steinel HF 360 II (input device, 4 instances: light/occupancy/temp/humidity)
#   addr 1: lamp + DALI-2 PB coupler (1 instance: push button, BF6 legacy mode)
#   addr 2, 3, 5: plain lamps
#   addr 4: absent
#   All lamps in group 0; BF6 coupler sends group 0 off/recall-max

esphome:
  name: dali-2k
  friendly_name: "DALI 2k"

esp32:
  variant: ESP32  # covers WROVER-E; add sdkconfig SPIRAM options if PSRAM needed
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: "3.1"

external_components:
  - source:
      type: local
      path: esphome/components
    components: [dali]

wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password
  ap:
    ssid: "dali-2k-ap"
    password: !secret ap_password
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG


# ── DALI bus ──────────────────────────────────────────────────────────────────
dali:
  id: dali_bus
  tx_pin: 18
  rx_pin: 19
  headless_dispatch:
    - { frame_kind: legacy_16bit, address_kind: group, address: 0, action: observe, output_type: group, output_address: 0 }
  command_result:
    name: "DALI Command Result"
  bus_fault:
    name: "Bus Fault"

# ── Lights ────────────────────────────────────────────────────────────────────
# One group covers all 5 lamps.
# query_address is only a COLD-START SEED for group state polling: the address
# used until the component learns real group membership. A bus scan replaces it
# with scan-verified members, and add-group/remove-group console commands update
# it live; both are persisted to flash and survive reboots. Pick a plain lamp
# (no shared input device) that is a member of the group. query_address=2 here.

light:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 0"
    target_type: group
    target_address: 0
    query_address: 2

# ── DALI command console ──────────────────────────────────────────────────────
# Type commands in HA; result appears in "DALI Command Result" text sensor.
# Reliable diagnostics: raw <hex> len=<16|24> [wait], raw2 <hex> len=<16|24> [wait]
# raw2 sends the same frame twice inside the DALI send-twice window; this avoids
# HA text entities swallowing repeated identical commands.
# Helper verbs:
#   queue/off/max/min/level/query/config/config-dtr0/iquery/iconfig/devmem/dtrcheck/group
#   memread, memwrite and devquery are NOT console verbs; use raw sequences.
# Targets: s<N>=short (bare <N> works too), g<N>=group, b=broadcast.
#   The old a<N> spelling is rejected with "bad target".
# Examples:
#   raw C13102 len=24    (DTR1 = 0x02 bank 2)
#   raw C13004 len=24    (DTR0 = 0x04 global sensitivity offset)
#   raw 01FE3C len=24 wait  (read memory location from Steinel)
#   raw2 01FE15 len=24    (ENABLE WRITE MEMORY x2)
#   query s0 actual                   (query name is "actual", not "actual-level")
#   config-dtr0 s0 set-max-dtr0 200   (set-max-dtr0 loads DTR0, so not plain config)
#   iquery 0 1 input-value            (addr and instance are separate args, not 0:1)
#   iconfig 0 1 occ-set-report-timer 5  (occupancy report timer; C13005 + 010122 x2)
#   raw 01FE36 len=24 wait  (opcode 0x36 = QUERY CONTENT DTR0)
#   raw 01FE37 len=24 wait  (opcode 0x37 = QUERY CONTENT DTR1)
#   dtrcheck 0 0 66  (C13042 + 01FE36, verifies control-device DTR0)
#   queue            (scheduler admission counters; queue reset to clear)
# Steinel Bank 2 map (from DALI-2 Interface Description V1.5):
#   0x02 = lock byte (write 0x55 to unlock before raw writes)
#   0x04 = global sensitivity  (0x00=min, 0xFF=max/default)
#   0x05 = detection range     (0x00=min, 0xFF=max)
#   0x06-0x09 = per-direction range      (0x00-0x64, percent)
#   0x0A-0x0D = per-direction sensitivity (0x00-0x64, percent)
text:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Command"
    mode: text

# ── Steinel HF 360 II — addr 0, 4 instances ──────────────────────────────────
# Unsolicited event frame instance byte (IEC 62386-103):
#   bit7=1 (input device), bits6:2=instance number, bits1:0=event scheme
#   0x80=inst0 (lux), 0x84=inst1 (occupancy), 0x88=inst2, 0x8C=inst3
# Occupancy raw values: 0=free, 85=movement, 170=hold/present, 255=present+moving.
# Occupancy sensor (inst 1, 1-byte): the 1s poll (QUERY_INPUT_VALUE) is the
# only source of the actual DT303 state. Confirmed on live hardware
# (2026-06-30): this Steinel's autonomous event report on instance 1 is NOT
# the DT303 state — it's a raw HF motion signal/diagnostic value that idles ~12 and
# swings both above and below that (observed 8-15) during real motion, i.e.
# sensor telemetry, not a debounced state. Firmware only accepts a pushed
# event value if it coincidentally equals one of the four valid states;
# everything else (the telemetry channel) is ignored so it can't stomp a good
# polled reading.
# Steinel factory section 3: hold timer 1 (~10 s), report timer 5 s.
# On-demand occupancy read: iquery 0 1 input-value  → 0=free 85=move 170=present 255=both
# Tune report timer:        iconfig 0 1 occ-set-report-timer N
# (hold-timer is not an iquery name; read it via the Bank 2 raw sequences.)
# Tune sensitivity/range with the raw Bank 2 sequences in steinel_bank2_reference.md.

sensor:
  - platform: dali
    dali_id: dali_bus
    name: "Zone 2 Lux"
    address: 0
    instance: 0
    poll_interval: 30
    # This instance reports on a timer (~3 s) regardless of change, so following
    # its events replaced the 30 s interval with the device's report rate and
    # nudged every third occupancy event ~95 ms late. Interval only.
    poll_on_event: false
    value_bytes: 2
    scale: 0.01
    unit_of_measurement: "lx"
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 0

  - platform: dali
    dali_id: dali_bus
    id: zone2_occ_raw
    name: "Zone 2 Occupancy Raw"
    address: 0
    instance: 1
    poll_interval: 1
    # Explicit though it is the default: this is the instance that must stay
    # responsive, so a change event polls immediately instead of waiting out
    # the interval.
    poll_on_event: true
    unit_of_measurement: ""
    state_class: measurement
    accuracy_decimals: 0
    internal: true
    # Push the decoded state the instant a poll lands, instead of letting a
    # second independent timer resample it. See "Zone 2 Occupancy" below.
    on_value:
      then:
        - lambda: |-
            int v = (int) x;
            const char *s = nullptr;
            if (v == 0)        s = "Unoccupied";
            else if (v == 85)  s = "Movement";
            else if (v == 170) s = "Present";
            else if (v == 255) s = "Present + Moving";
            if (s == nullptr) return;                  // noise: hold last state
            if (id(zone2_occ).state == s) return;      // no change: stay quiet
            id(zone2_occ).publish_state(s);

  - platform: dali
    dali_id: dali_bus
    name: "Zone 2 Temperature"
    address: 0
    instance: 2
    poll_interval: 60
    poll_on_event: false
    value_bytes: 2
    scale: 0.1
    offset: -5.0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: dali
    dali_id: dali_bus
    name: "Zone 2 Humidity"
    address: 0
    instance: 3
    poll_interval: 60
    poll_on_event: false
    scale: 0.5
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0

# ── Occupancy state (human-readable) ─────────────────────────────────────────
# Maps DT303 bit-replicated values: 0=free, 85=movement, 170=present, 255=present+moving.
# Any other raw byte (occasional corrupted poll/event reply) is treated as noise
# and skipped rather than published as "Unknown" — publishing "Unknown" was
# breaking the corridor presence automation's `from: Unoccupied` triggers, since
# HA's literal prior-state match failed whenever a noisy sample landed in between.
#
# This entity is push-driven from zone2_occ_raw's on_value (update_interval:
# never). It used to resample on its own 5s timer, which was unsynchronised
# with the 2s poll and added up to a full extra interval of latency before the
# corridor automation ever saw a presence change.
text_sensor:
  - platform: template
    id: zone2_occ
    name: "Zone 2 Occupancy"
    update_interval: never
