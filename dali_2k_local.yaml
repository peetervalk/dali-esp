# dali_2k_local.yaml — local-component build of dali_2k for development.
# Uses esphome/components from the working tree so no git credentials are needed.
# DO NOT flash to production without testing. Production firmware: dali_2k.yaml.

esphome:
  name: dali-2k
  friendly_name: "DALI 2k"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: esphome/components

wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password
  ap:
    ssid: "dali-2k-ap"
    password: !secret ap_password
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

# ── DALI bus ──────────────────────────────────────────────────────────────────
dali:
  id: dali_bus
  tx_pin: 18
  rx_pin: 19
  headless_dispatch: true
  command_result:
    name: "DALI Command Result"

# ── Lights ────────────────────────────────────────────────────────────────────
light:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Group 0"
    target_type: group
    target_address: 0
    query_address: 2

# ── DALI command console ──────────────────────────────────────────────────────
# Type commands in HA; result appears in "DALI Command Result" text sensor.
# Reliable diagnostics: raw <hex> len=<16|24> [wait], raw2 <hex> len=<16|24> [wait]
# raw2 sends the same frame twice inside the DALI send-twice window; this avoids
# HA text entities swallowing repeated identical commands.
# Existing helper verbs remain available:
#   off/max/min/level/query/config/iquery/iconfig/memread/memwrite/devquery/dtrcheck
# Targets: a<N>=short, g<N>=group, b=broadcast
# Examples:
#   raw C302 len=16       (DTR1 = 0x02 bank 2)
#   raw A304 len=16       (DTR0 = 0x04 global sensitivity offset)
#   raw 01FE3C len=24 wait  (read memory location from Steinel)
#   raw2 01FE15 len=24    (ENABLE WRITE MEMORY x2)
#   query a0 actual-level
#   config a0 set-max-dtr0 200
#   iconfig a0:1 set-hold-timer 20  (occupancy hold timer for Steinel, DTR0=20)
#   memread  a0 2 4    (read  Steinel Bank 2 offset 0x04 = global sensitivity)
#   memread  a0 2 5    (read  Steinel Bank 2 offset 0x05 = detection range)
#   memwrite a0 2 4 128  (write 0x80 = ~50% sensitivity to Bank 2 offset 0x04)
#   memwrite a0 2 5 128  (write 0x80 = ~50% detection range to Bank 2 offset 0x05)
#   devquery a0 48   (raw 24-bit device query: opcode 0x30 = QUERY CONTENT DTR0)
#   devquery a0 49   (raw 24-bit device query: opcode 0x31 = QUERY CONTENT DTR1)
#   dtrcheck a0 0 66 (set DTR0=0x42, query it back; reply=66 means SET works, else broken)
# Steinel Bank 2 map (from DALI-2 Interface Description V1.5):
#   0x02 = lock byte (write 0x55 to unlock; done automatically by memwrite)
#   0x04 = global sensitivity  (0x00=min, 0xFF=max/default)
#   0x05 = detection range     (0x00=min, 0xFF=max)
#   0x06-0x09 = per-direction range      (0x00-0x64, percent)
#   0x0A-0x0D = per-direction sensitivity (0x00-0x64, percent)
text:
  - platform: dali
    dali_id: dali_bus
    name: "DALI Command"
    mode: text

# ── Steinel HF 360 II — addr 0, 4 instances ──────────────────────────────────
# Instance byte seen in unsolicited frames: 0x80=inst0, 0x84=inst2 (approx).
# Occupancy raw values: 0=free, 85=movement, 170=hold/present, 255=present+moving.
# Hold timer default is about 900 s (15 min).
# On-demand occupancy read: iquery a0:1 input-value  → 0=free 85=move 170=present 255=both
# Read before writing:      iquery a0:1 hold-timer
# Tune hold timer:          iconfig a0:1 set-hold-timer N
# Tune sensitivity (global):     memread/memwrite a0 2 4 <0x00-0xFF>
# Tune detection range (HF, global): memread/memwrite a0 2 5 <0x00-0xFF>
sensor:
  - platform: dali
    dali_id: dali_bus
    name: "Zone 2 Lux"
    address: 0
    instance: 0
    poll_interval: 30
    value_bytes: 2
    scale: 0.01
    unit_of_measurement: "lx"
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 0

  - platform: dali
    dali_id: dali_bus
    id: zone2_occ_raw
    name: "Zone 2 Occupancy Raw"
    address: 0
    instance: 1
    poll_interval: 10
    unit_of_measurement: ""
    state_class: measurement
    accuracy_decimals: 0
    internal: true

  - platform: dali
    dali_id: dali_bus
    name: "Zone 2 Temperature"
    address: 0
    instance: 2
    poll_interval: 60
    value_bytes: 2
    scale: 0.1
    offset: -5.0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: dali
    dali_id: dali_bus
    name: "Zone 2 Humidity"
    address: 0
    instance: 3
    poll_interval: 60
    scale: 0.5
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0

# ── Occupancy state (human-readable) ─────────────────────────────────────────
text_sensor:
  - platform: template
    name: "Zone 2 Occupancy"
    lambda: |-
      int v = (int) id(zone2_occ_raw).state;
      if (v == 0)   return {"Unoccupied"};
      if (v == 85)  return {"Movement"};
      if (v == 170) return {"Present"};
      if (v == 255) return {"Present + Moving"};
      return {"Unknown"};
    update_interval: 10s
